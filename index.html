<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Pietra Valentina e Victor Hugo -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="cabecalho">
        <img src="https://www.freepnglogos.com/uploads/pokemon-symbol-logo-png-31.png" alt="Logo do Pokémon" class="cabecalho-logo">
        <h1>POKÉDEX</h1>
    </header>

    <main>
        <form id="busca" class="busca">
            <label for="pokemonNome">Digite o nome de um Pokémon</label>
            <div class="busca-campos">
                <input id="pokemonNome" placeholder="Nome do Pokémon">
                <button>Buscar</button>
            </div>
        </form>

       
        <section id="resultado" class="resultado"></section>
    </main>

</body>
</html>
